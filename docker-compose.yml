# Postgres for the shop and Qdrant for Mem0's memories. Postgres init scripts run only on an empty
# volume, so `./run.sh reset` (drop the pgdata volume, then up) is how a run starts from a known
# state; memories in Qdrant are cleared per user by the eval runner, not by reset.
name: support-desk
services:
  db:
    image: postgres:16
    container_name: support-db
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TOOLBOX_DB_PASSWORD: ${TOOLBOX_DB_PASSWORD:?set TOOLBOX_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"   # 5432 and 5433 are already taken on this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init/01-toolbox-role.sh:/docker-entrypoint-initdb.d/01-toolbox-role.sh:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/init/03-grants.sql:/docker-entrypoint-initdb.d/03-grants.sql:ro
    healthcheck:
      # TCP check: the entrypoint's temporary init server listens on the socket only,
      # so this passes only after every init script has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Vector store for self-hosted Mem0 (the cloud free tier's 1 000 searches ran out mid-eval).
  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: support-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
